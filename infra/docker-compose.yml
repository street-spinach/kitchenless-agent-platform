# Local and VM stack (ENGINEERING_PROCESS.md section 4, item 2).
# Services without a profile start with `make up`, `infra/deploy.sh` and CI's `--profile ci`.
# Only Caddy publishes public ports; everything else binds to 127.0.0.1.
name: spinach

x-app: &app
  build:
    context: ..
    dockerfile: infra/Dockerfile
  image: spinach-app:local
  restart: unless-stopped

# Environment matrix (docs/designs/architecture.md, "Environment matrix"). One block per
# row group; each service merges the blocks the matrix names for it. SERVICE_NAME is set
# per service.
x-env-base: &env-base # all app and migrate
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-env-app: &env-app # all app
  APPROVAL_TTL_SECONDS: ${APPROVAL_TTL_SECONDS:-14400}
  RUN_TIMEOUT_SECONDS: ${RUN_TIMEOUT_SECONDS:-300}
  QUOTE_ROUND_SECONDS: ${QUOTE_ROUND_SECONDS:-30}
  MOCK_TOKEN_SECRET: ${MOCK_TOKEN_SECRET}

x-env-modes: &env-modes # api, testrunner
  MODE: ${MODE:-mock}
  MODE_FORCE_MOCK: ${MODE_FORCE_MOCK:-}
  MODE_KROGER_CATALOG: ${MODE_KROGER_CATALOG:-}
  MODE_KROGER_ORDERING: ${MODE_KROGER_ORDERING:-}
  MODE_SQUARE_RETAIL: ${MODE_SQUARE_RETAIL:-}
  MODE_SQUARE_RESTAURANT: ${MODE_SQUARE_RESTAURANT:-}
  MODE_DOORDASH: ${MODE_DOORDASH:-}

x-env-model: &env-model # agents, testrunner
  MODEL_MODE: ${MODEL_MODE:-stub}
  MODEL_BASE_URL: ${MODEL_BASE_URL:-}
  MODEL_NAME: ${MODEL_NAME:-}
  MODEL_API_KEY: ${MODEL_API_KEY:-}
  MODEL_FALLBACK_BASE_URL: ${MODEL_FALLBACK_BASE_URL:-}
  MODEL_FALLBACK_NAME: ${MODEL_FALLBACK_NAME:-}
  MODEL_FALLBACK_API_KEY: ${MODEL_FALLBACK_API_KEY:-}
  RUN_TOKEN_CEILING: ${RUN_TOKEN_CEILING}
  MODEL_BUSINESS_NAME: ${MODEL_BUSINESS_NAME:-Muse Glimmer}
  MODEL_BUSINESS_TIMEOUT_SECONDS: ${MODEL_BUSINESS_TIMEOUT_SECONDS:-5}

x-env-graph: &env-graph # mcp, testrunner
  NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
  NEO4J_USER: ${NEO4J_USER:-neo4j}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD}
  OPENFGA_API_URL: ${OPENFGA_API_URL:-http://openfga:8080}
  OPENFGA_STORE_ID: ${OPENFGA_STORE_ID:-}
  KROGER_CLIENT_ID: ${KROGER_CLIENT_ID:-}
  KROGER_CLIENT_SECRET: ${KROGER_CLIENT_SECRET:-}
  KROGER_LOCATION_ID: ${KROGER_LOCATION_ID:-}

# Identity (docs/designs/identity-authz.md §13). Empty values count as unset, and each
# service refuses to start without the ones it needs for the active TOKEN_SOURCE.
x-env-identity: &env-identity # agents, api, mcp, testrunner
  TOKEN_SOURCE: ${TOKEN_SOURCE:-}
  ISSUER_URL: ${ISSUER_URL:-}
  DOMAIN: ${DOMAIN:-localhost}
  MOCK_SIGNING_KEY: ${MOCK_SIGNING_KEY:-}

x-env-keycloak: &env-keycloak # agents, api, mcp (required live)
  KEYCLOAK_URL: ${KEYCLOAK_URL:-http://keycloak:8080/auth}

x-env-grants: &env-grants # agents, api (required live)
  AGENT_SIGNING_KEY: ${AGENT_SIGNING_KEY:-}
  GRANT_ENCRYPTION_KEY: ${GRANT_ENCRYPTION_KEY:-}
  GRANT_KEY_VERSION: ${GRANT_KEY_VERSION:-}

x-env-shortfall: &env-shortfall # agents, api, mcp (agent-protocol §13)
  SHORTFALL_REPLY_SECONDS: ${SHORTFALL_REPLY_SECONDS:-900}
  SHORTFALL_MAX_LINES: ${SHORTFALL_MAX_LINES:-3}

x-app-health: &app-health
  test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['PORT'] + '/health', timeout=3)"]
  interval: 5s
  timeout: 5s
  retries: 20

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    command: postgres -c shared_buffers=128MB -c max_connections=60
    mem_limit: 384m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: ["start-dev"]
    # architecture §11. The heap and the 26.8 image are identity-authz work (#122).
    mem_limit: 640m
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: "-Xms256m -Xmx512m"
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "127.0.0.1:8180:8080"
    healthcheck:
      # The image has no curl; probe the management port with bash.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  openfga-migrate:
    image: openfga/openfga:v1.8.4
    command: ["migrate"]
    # One-shot, not in the §11 table: capped like openfga.
    mem_limit: 128m
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/openfga?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }

  openfga:
    image: openfga/openfga:v1.8.4
    restart: unless-stopped
    command: ["run"]
    mem_limit: 128m
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/openfga?sslmode=disable
      OPENFGA_PLAYGROUND_ENABLED: "false"
      OPENFGA_DATASTORE_MAX_OPEN_CONNS: "10"
    depends_on:
      openfga-migrate: { condition: service_completed_successfully }
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=127.0.0.1:8081"]
      interval: 5s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    mem_limit: 896m
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      # Heap 512 MB and page cache 192 MB (architecture §11).
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 192m
    volumes:
      - neo4jdata:/data
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Applies migrations/*.sql once per `up`, before any app service starts.
  migrate:
    <<: *app
    restart: "no"
    command: ["python", "-m", "migrations.apply"]
    # One-shot, not in the §11 table: capped like testrunner, the other one-shot app container.
    mem_limit: 256m
    environment:
      <<: *env-base
      SERVICE_NAME: migrate
    depends_on:
      postgres: { condition: service_healthy }

  # api, mcp and agents (architecture item 56). The app ports are bound to 127.0.0.1 only;
  # Caddy reaches api over the Compose network. agents (8003, including the internal A2A
  # endpoint) has no Caddy route.
  api:
    <<: *app
    command: ["python", "-m", "services.api.main"]
    mem_limit: 256m
    stop_grace_period: 30s
    environment:
      <<: [*env-base, *env-app, *env-identity, *env-keycloak, *env-grants, *env-modes, *env-shortfall]
      SERVICE_NAME: api
      PORT: "8000"
      AGENT_SIGNING_CERT: ${AGENT_SIGNING_CERT:-}
      TOKEN_SERVICE_KEY: ${TOKEN_SERVICE_KEY:-}
      KC_ONBOARDING_SECRET: ${KC_ONBOARDING_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      DOORDASH_WEBHOOK_PATH_SECRET: ${DOORDASH_WEBHOOK_PATH_SECRET:-}
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck: *app-health

  mcp:
    <<: *app
    command: ["python", "-m", "services.mcp.app"]
    mem_limit: 320m
    stop_grace_period: 30s
    environment:
      <<: [*env-base, *env-app, *env-identity, *env-keycloak, *env-graph, *env-shortfall]
      SERVICE_NAME: mcp
      PORT: "8002"
      DOORDASH_DEVELOPER_ID: ${DOORDASH_DEVELOPER_ID:-}
      DOORDASH_KEY_ID: ${DOORDASH_KEY_ID:-}
      DOORDASH_SIGNING_SECRET: ${DOORDASH_SIGNING_SECRET:-}
      SQUARE_RETAIL_TOKEN: ${SQUARE_RETAIL_TOKEN:-}
      SQUARE_RESTAURANT_TOKEN: ${SQUARE_RESTAURANT_TOKEN:-}
      SQUARE_ENV: ${SQUARE_ENV:-sandbox}
      SQUARE_RETAIL_LOCATION_ID: ${SQUARE_RETAIL_LOCATION_ID:-}
      SQUARE_RESTAURANT_LOCATION_ID: ${SQUARE_RESTAURANT_LOCATION_ID:-}
      MOCK_COURIER_STEP_SECONDS: ${MOCK_COURIER_STEP_SECONDS:-20}
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    ports:
      - "127.0.0.1:8002:8002"
    healthcheck: *app-health

  agents:
    <<: *app
    command: ["python", "-m", "services.agents.host"]
    mem_limit: 384m
    stop_grace_period: 30s
    environment:
      <<: [*env-base, *env-app, *env-identity, *env-keycloak, *env-grants, *env-model, *env-shortfall]
      SERVICE_NAME: agents
      PORT: "8003"
      OFFER_TTL_SECONDS: ${OFFER_TTL_SECONDS:-600}
      COURIER_QUOTE_TTL_SECONDS: ${COURIER_QUOTE_TTL_SECONDS:-120}
      A2A_DEMO_TIMEOUT_SECONDS: ${A2A_DEMO_TIMEOUT_SECONDS:-900}
      A2A_SEND_WAIT_SECONDS: ${A2A_SEND_WAIT_SECONDS:-10}
      A2A_MAX_REQUEST_BYTES: ${A2A_MAX_REQUEST_BYTES:-32768}
      A2A_RATE_PER_SECOND: ${A2A_RATE_PER_SECOND:-10}
      A2A_DEMO_TOKEN: ${A2A_DEMO_TOKEN}
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    ports:
      - "127.0.0.1:8003:8003"
    healthcheck: *app-health

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 64m
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      # /panel/* basic auth (Caddyfile). When these are empty the panel fails closed: the
      # default is a base64 bcrypt hash of a discarded random password, so nobody can log in
      # and Caddy still starts.
      PANEL_USER: ${PANEL_USER:-panel-disabled}
      PANEL_PASSWORD_HASH: ${PANEL_PASSWORD_HASH:-JDJiJDE0JEd3djJVcVhOUTNPU0Nza01uQXFJNS5BYTVTTHdhWm85M3VQVWxLL0NFWGtJN24vOVUyWHFx}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Used by `make smoke`, `make scenario` and `make eval-full` via `docker compose run`.
  # In the tools profile so `up --wait` does not start it.
  testrunner:
    <<: *app
    restart: "no"
    profiles: ["tools"]
    mem_limit: 256m
    command: ["python", "-c", "print('testrunner: pass a command')"]
    environment:
      # DOMAIN (from env-identity) is also used by the smoke tests (Caddy SNI) and the eval
      # runner (POST /hello/run on api).
      <<: [*env-base, *env-app, *env-identity, *env-modes, *env-model, *env-graph]
      SERVICE_NAME: testrunner
      A2A_DEMO_TOKEN: ${A2A_DEMO_TOKEN}
      AGENTS_URL: ${AGENTS_URL:-http://agents:8003}
      SEED_US1_PHONES: ${SEED_US1_PHONES:-}
      ORCHESTRATOR_URL: http://api:8000

  # The ci profile is reserved for CI-only helpers (for example a stub token issuer).
  # Today `--profile ci` starts the same services as `make up`.

volumes:
  pgdata:
  neo4jdata:
  caddydata:
  caddyconfig:
