name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_IMAGE: ghcr.io/street-spinach/kitchenless-app
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push app image
        run: |
          docker build -f infra/Dockerfile -t "$APP_IMAGE:${{ github.sha }}" .
          docker push "$APP_IMAGE:${{ github.sha }}"

  deploy:
    needs: build
    # Run even when build fails, so the existing failure step reports it. The SSH and
    # deploy steps also require a successful build, so a failed build never deploys.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        if: ${{ !cancelled() }}

      - name: Configure SSH
        if: needs.build.result == 'success'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy and verify on VM
        if: needs.build.result == 'success'
        shell: bash
        run: |
          set -o pipefail
          ssh "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" \
            "cd /opt/app && git fetch --quiet origin && git checkout --quiet --force ${{ github.sha }} && ./infra/deploy.sh ${{ github.sha }}" \
            2>&1 | tee deploy.log

      - name: Tag green deploy
        if: success()
        run: |
          tag="deploy-$(date -u +%Y%m%d-%H%M%S)"
          git tag "$tag" "${{ github.sha }}"
          git push origin "$tag"

      - name: Report success
        if: success()
        run: bash scripts/ci/report_deploy.sh success
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}

      - name: Report failure
        if: failure()
        run: bash scripts/ci/report_deploy.sh failure
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
