name: ci
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          # Throwaway CI credentials, not secrets.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kitchenless_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kitchenless_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kitchenless_test
      MODE_FORCE_MOCK: "1"
      MODEL_MODE: stub
      # Throwaway CI dummies, not secrets (identity-authz §13), so every service starts
      # under TOKEN_SOURCE=mock.
      OPENFGA_PRESHARED_KEY: change-me-ci
      SESSION_SECRET: change-me-ci
      AGENT_SIGNING_CERT: Y2ktZHVtbXk=
      # The pinned fga CLI for `make fga-test` (identity-authz I7, I38).
      FGA_VERSION: 0.8.2
      FGA_SHA256: e48c4a73cf68031fe9fc0827f1462a9b2d6981e3d2e9b82f1e1c2e120c293443
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Install the fga CLI
        run: |
          curl -sSfL -o "$RUNNER_TEMP/fga.tar.gz" \
            "https://github.com/openfga/cli/releases/download/v${FGA_VERSION}/fga_${FGA_VERSION}_linux_amd64.tar.gz"
          echo "${FGA_SHA256}  $RUNNER_TEMP/fga.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/fga"
          tar -xzf "$RUNNER_TEMP/fga.tar.gz" -C "$RUNNER_TEMP/fga" fga
          echo "$RUNNER_TEMP/fga" >> "$GITHUB_PATH"
      - run: make lint
      - run: make fga-test
      - run: make test-unit
      - run: make test-contract
        env:
          MODE: mock

  # The owner app's lint and tests (experience EX-I24).
  owner-app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: node:22
    steps:
      - uses: actions/checkout@v4
      - run: make app-lint app-test

  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: bash scripts/ci/count_guard.sh origin/${{ github.base_ref }}

  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Stub only: no model key in any CI job (evals.md EG1, architecture item 63).
    env:
      MODEL_MODE: stub
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: changed
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qE '^(services/agents/|services/mcp/|services/safety/|services/identity/|services/common/|services/api/|services/seed/|migrations/|evals/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == 'true'
        uses: astral-sh/setup-uv@v5
      - if: steps.changed.outputs.run == 'true'
        run: |
          cp infra/.env.example infra/.env
          docker compose -f infra/docker-compose.yml --env-file infra/.env --profile ci up -d --wait
          uv sync --frozen
          make seed SEED_ARGS="--env eval"
          make eval-safety
        env:
          MODE: mock
      - if: always() && steps.changed.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/
          if-no-files-found: warn
      - if: always() && steps.changed.outputs.run == 'true'
        run: |
          latest=$(ls -t evals/results/*.md 2>/dev/null | head -n 1 || true)
          if [ -n "$latest" ]; then
            cat "$latest" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No eval results were written." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.changed.outputs.run == 'false'
        run: echo "No agent behavior changed. Evals skipped."
