# Grocery catalogs for the mock-backed stores (architecture item 55). Prices in USD minor
# units. Allergen and diet values use the fixed code lists (migration 0002). Every SKU here
# has a product in off_subset.json with the same allergens; the seed checks this.
# `pantry_item` names the SKU's item in pantry_items.yaml (pantry design §2, PT-A6); the seed
# refuses a name that is not in the vocabulary.

# Agent-protocol P34 shortfall fixture in grocery:mock-us: the weekly item MOCK-MILK-WHOLE
# with one safe substitute and one tree-nut substitute, both priced at or below it.
shortfall_fixture:
  agent_id: grocery:mock-us
  sku: MOCK-MILK-WHOLE
  safe_substitute: MOCK-MILK-2PCT
  unsafe_substitute: MOCK-MILK-ALMOND

catalogs:
  grocery:mock-us:
    - {sku: MOCK-MILK-WHOLE, name: Whole milk 1 gal, brand: Farm Fresh,
       ingredients: whole milk, allergens: [milk], diets: [vegetarian], price_minor: 429,
       pantry_item: milk}
