       ingredients: reduced fat milk, allergens: [milk], diets: [vegetarian], price_minor: 399,
       pantry_item: milk}
    - {sku: MOCK-MILK-ALMOND, name: Almond milk 64 oz, brand: Grove,
       ingredients: almond milk (water almonds), allergens: [tree_nuts],
       diets: [vegetarian, vegan], price_minor: 379, pantry_item: almond milk}
