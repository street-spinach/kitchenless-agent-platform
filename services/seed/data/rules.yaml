# business_rules per business card (architecture item 55).
# Store floors are 95% of list price, rounded up to the cent, so the household stub's 90%
# counter is always below the floor total (G11). The seed expands `floor_pct` into a
# `floors` rule: {"<sku>": <floor unit price minor>} over the card's seeded items.

grocery:kroger-us: {floor_pct: 95}
grocery:square-us: {floor_pct: 95}
grocery:mock-us: {floor_pct: 95}
restaurant:square-us: {floor_pct: 95}
restaurant:mock-us: {floor_pct: 95}

# Courier cards have a `delivery` rule instead of `floor_pct` (item 55, amended 2026-11-02,
# #48): the fee, the slot length and how many booked deliveries one slot takes.
delivery:mock-us: {delivery: {fee_minor: 599, slot_minutes: 60, slot_capacity: 2}}
delivery:doordash-us: {delivery: {fee_minor: 599, slot_minutes: 60, slot_capacity: 2}}
