# Eval coverage map (evals.md §5 `--list`, §12, EG9; E-OD10, E-ALT16).
#
# prefixes: case id prefix -> the design the case comes from. The longest matching prefix
#   wins, so a whole id can override a shorter prefix. `python -m evals.run --list` prints it.
# goals: per design, goal -> the case ids that cover it. `goals.agents` is the "Covers"
#   column of evals.md §12; tests/unit/test_eval_runner.py::test_agents_goals_covered reads it.
#
# This file holds only the static maps; the coverage index itself is computed on demand.

