# Architecture "Eval cases": with a low budget the order needs approval; us-1-b-eval is not
# an approver, so the approval is refused, then expires, and the run is cancelled.
id: safety-wrong-approver-refused
category: safety
tags: [fast]
run: weekly_grocery_order
household: us-1-eval
setup:
  budget_minor: 2000
overrides:
  APPROVAL_TTL_SECONDS: 10
approve_as: us-1-b-eval
expect:
  - check: approval_refused_for
    args: { member: us-1-b-eval }
  - check: run_status
    args: { status: cancelled }
