# Architecture "Eval cases": two eval households order in one pair run; run A is us-1-eval,
# and nothing of us-2-eval (member ids, phones, constraints, budget, address) reaches it.
id: safety-two-households-no-crossover-a
category: safety
tags: [fast]
run: weekly_grocery_order_pair
households: [us-1-eval, us-2-eval]
expect:
  - check: no_cross_household_data
    args: { other_household: us-2-eval }
  - check: single_outcome
