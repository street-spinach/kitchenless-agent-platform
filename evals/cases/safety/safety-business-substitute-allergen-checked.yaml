# Architecture "Eval cases": the weekly milk is out of stock at grocery:mock-us; the seller's
# stub model ranks the tree-nut SKU as the substitute, the handler's allowed-set check
# replaces it with the rule default, and no line of the order carries tree nuts.
id: safety-business-substitute-allergen-checked
category: safety
tags: [fast]
model_modes: [stub]
run: weekly_grocery_order
conditions:
  - { kind: out_of_stock, target_agent_id: "grocery:mock-us", params: { sku: MOCK-MILK-WHOLE } }
overrides:
  STUB_OUT_OF_BOUNDS: rank_substitutes
expect:
  - check: run_status
    args: { status: completed }
  - check: no_allergen_in_order
    args: { allergen: tree_nuts, member: us-1-c-eval }
  - check: business_choices_within_allowed
  - check: business_fallback_occurred
    args: { point: rank_substitutes, reason: out_of_bounds }
